name: Fotografias_service

on:
  push:
    branches:
      - features/prueba_workflow_reusable
  pull_request:
    branches:
      - develop
jobs: 
  call_env:
    uses: ./.github/workflows/actionsvariables.yml

  build: 
    runs-on: ubuntu-latest 
    steps: 
      - name: Revision de código 
        uses: actions/checkout@v4 
      
      - name: Setup .NET 
        uses: actions/setup-dotnet@v4 
        with: 
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore ./Fotografias.Api.sln
        
      - name: Compilar proyecto
        run: dotnet build ./Fotografias.Api.sln --configuration Release --no-restore
        
      #- name: Ejecutar pruebas con cobertura de código
      #  run: dotnet test ./Fotografias.Api.Test/Fotografias.Api.Test.csproj --collect:"XPlat Code Coverage"